<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&amp;display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=block"></helmet>
<div role="button" tabIndex="0" onClick="{{ select }}" onFocus="{{ onRowFocus }}" onBlur="{{ onRowBlur }}" aria-current="{{ selected }}" style="box-sizing: border-box; width: 100%; min-height: 72px; display: flex; align-items: center; gap: var(--md-sys-space-16); padding: var(--md-sys-space-8) var(--md-sys-space-24) var(--md-sys-space-8) var(--md-sys-space-16); background: {{ rowBg }}; outline: {{ rowOutline }}; outline-offset: -3px; cursor: pointer; transition: background var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);" style-hover="{{ rowHover }}">
  <button aria-label="{{ playLabel }}" title="{{ playLabel }}" onClick="{{ play }}" style="flex: none; width: 48px; height: 48px; margin: -4px; padding: 0; border: none; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer;">
    <span style="width: 40px; height: 40px; border-radius: var(--md-sys-shape-corner-full); display: flex; align-items: center; justify-content: center; background: {{ playBg }}; color: {{ playFg }};">
      <span style="font-family: 'Material Symbols Outlined'; font-size: 24px; line-height: 1; font-variation-settings: 'FILL' 1;">{{ playIcon }}</span>
    </span>
  </button>
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
    <div style="font: var(--md-sys-typescale-body-large); letter-spacing: var(--md-sys-typescale-body-large-tracking); color: {{ headColor }}; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-wrap: pretty;">{{ title }}</div>
    <div style="font: var(--md-sys-typescale-body-medium); letter-spacing: var(--md-sys-typescale-body-medium-tracking); color: {{ subColor }};">{{ dateLabel }}</div>
  </div>
  <div style="flex: none; display: flex; align-items: center; gap: var(--md-sys-space-4); color: {{ subColor }};">
    <sc-if value="{{ played }}" hint-placeholder-val="{{ false }}"><span style="font-family: 'Material Symbols Outlined'; font-size: 18px; line-height: 1;">check_circle</span></sc-if>
    <span style="font: var(--md-sys-typescale-label-medium); letter-spacing: var(--md-sys-typescale-label-medium-tracking); font-variant-numeric: tabular-nums; white-space: nowrap;">{{ duration }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:400,&quot;height&quot;:80},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Kotlin 2.4 in ten minutes&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;duration&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;31m&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;date&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2026-10-02&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;playing&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;paused&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;played&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;force&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;hover&quot;,&quot;focus&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onSelect&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onPlay&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { focus: false };
  renderVals() {
    const p = this.props;
    const v = n => `var(--md-sys-color-${n})`;
    const force = p.force ?? '';
    const sel = !!p.selected, playing = !!p.playing, paused = !!p.paused, played = !!p.played && !playing;
    const d = new Date((p.date ?? '2026-10-02') + 'T12:00:00');
    const dateLabel = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const baseBg = sel ? v('secondary-container') : (force === 'hover' ? v('surface-container-high') : 'transparent');
    const onSel = sel ? 'on-secondary-container' : null;
    return {
      title: p.title ?? 'Kotlin 2.4 in ten minutes', duration: p.duration ?? '31m', dateLabel, played,
      selected: sel,
      rowBg: baseBg,
      rowHover: sel ? `background: ${v('secondary-container')}` : `background: ${v('surface-container-high')}`,
      rowOutline: (force === 'focus' || this.state.focus) ? `3px solid ${v('secondary')}` : 'none',
      headColor: playing ? v('primary') : (played ? v('on-surface-variant') : v(onSel || 'on-surface')),
      subColor: v(onSel || 'on-surface-variant'),
      playBg: playing ? v('primary') : v(sel ? 'surface-container-lowest' : 'secondary-container'),
      playFg: playing ? v('on-primary') : v(sel ? 'on-surface' : 'on-secondary-container'),
      playIcon: playing && !paused ? 'pause' : 'play_arrow',
      playLabel: playing && !paused ? 'Pause' : 'Play',
      select: () => p.onSelect && p.onSelect(),
      play: e => { e.stopPropagation(); p.onPlay && p.onPlay(); },
      onRowFocus: e => { if (e.target === e.currentTarget) { let k = false; try { k = e.currentTarget.matches(':focus-visible'); } catch (_) {} this.setState({ focus: k }); } },
      onRowBlur: () => this.setState({ focus: false }),
    };
  }
}
</script>
</body>
</html>
