<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&amp;display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=block"></helmet>
<div role="button" tabIndex="0" onClick="{{ select }}" onFocus="{{ onCardFocus }}" onBlur="{{ onCardBlur }}" aria-pressed="{{ selected }}" style="box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: var(--md-sys-space-8); padding: var(--md-sys-space-8); border-radius: var(--md-sys-shape-corner-medium); background: {{ cardBg }}; border: 2px solid {{ border }}; outline: {{ cardOutline }}; outline-offset: 2px; cursor: pointer; transition: background var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);" style-hover="background: var(--md-sys-color-surface-container-high);">
  <div style="position: relative; aspect-ratio: 1 / 1; border-radius: var(--md-sys-shape-corner-small); background: {{ coverBg }}; color: {{ coverFg }}; display: flex; align-items: center; justify-content: center;">
    <span style="font-family: 'Material Symbols Outlined'; font-size: 40px; line-height: 1; font-variation-settings: 'FILL' 1;">{{ glyph }}</span>
    <span style="position: absolute; left: var(--md-sys-space-8); bottom: var(--md-sys-space-8); font: var(--md-sys-typescale-label-medium); letter-spacing: var(--md-sys-typescale-label-medium-tracking);">{{ category }}</span>
  </div>
  <div style="font: var(--md-sys-typescale-title-small); letter-spacing: var(--md-sys-typescale-title-small-tracking); color: var(--md-sys-color-on-surface); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 40px; padding: 0 var(--md-sys-space-4); text-wrap: pretty;">{{ title }}</div>
  <div style="display: flex; align-items: center; gap: var(--md-sys-space-4); margin-top: -4px;">
    <div style="flex: 1; min-width: 0; padding-left: var(--md-sys-space-4); font: var(--md-sys-typescale-body-small); letter-spacing: var(--md-sys-typescale-body-small-tracking); color: var(--md-sys-color-on-surface-variant); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 32px;">{{ author }}</div>
    <button aria-label="{{ toggleLabel }}" aria-pressed="{{ subscribed }}" title="{{ toggleLabel }}" onClick="{{ toggle }}" onFocus="{{ onBtnFocus }}" onBlur="{{ onBtnBlur }}" style="flex: none; width: 48px; height: 48px; margin: -4px -4px -4px 0; padding: 0; border: none; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer; outline: none;">
      <span style="width: 40px; height: 40px; border-radius: var(--md-sys-shape-corner-full); display: flex; align-items: center; justify-content: center; background: {{ btnBg }}; outline: {{ btnOutline }}; outline-offset: 2px; color: {{ subColor }}; transition: background var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);" style-hover="background: var(--md-sys-color-surface-container-highest);">
        <span style="font-family: 'Material Symbols Outlined'; font-size: 24px; line-height: 1; font-variation-settings: {{ subFill }};">{{ subIcon }}</span>
      </span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:180,&quot;height&quot;:280},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Compiled Weekly&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;author&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ada Moreno&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;category&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Tech&quot;,&quot;News&quot;,&quot;Comedy&quot;],&quot;default&quot;:&quot;Tech&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subscribed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;force&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;hover&quot;,&quot;focus&quot;,&quot;hoverToggle&quot;,&quot;focusToggle&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onSelect&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onToggle&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { cardFocus: false, btnFocus: false };
  renderVals() {
    const p = this.props;
    const v = n => `var(--md-sys-color-${n})`;
    const map = { Tech: ['secondary-container', 'on-secondary-container', 'terminal'], News: ['tertiary-container', 'on-tertiary-container', 'newspaper'], Comedy: ['primary-container', 'on-primary-container', 'sentiment_very_satisfied'] };
    const category = p.category ?? 'Tech';
    const [c, oc, glyph] = map[category] || map.Tech;
    const force = p.force ?? '';
    const sub = !!p.subscribed;
    const ring = `3px solid ${v('secondary')}`;
    const kb = e => { try { return e.currentTarget.matches(':focus-visible'); } catch (_) { return false; } };
    return {
      title: p.title ?? 'Compiled Weekly', author: p.author ?? 'Ada Moreno', category, glyph,
      coverBg: v(c), coverFg: v(oc),
      cardBg: v(force === 'hover' ? 'surface-container-high' : 'surface-container'),
      border: p.selected ? v('primary') : 'transparent',
      selected: !!p.selected, subscribed: sub,
      cardOutline: (force === 'focus' || this.state.cardFocus) ? ring : 'none',
      btnOutline: (force === 'focusToggle' || this.state.btnFocus) ? ring : 'none',
      btnBg: force === 'hoverToggle' ? v('surface-container-highest') : 'transparent',
      subIcon: sub ? 'bookmark_added' : 'bookmark_add',
      subColor: v(sub ? 'primary' : 'on-surface-variant'),
      subFill: sub ? "'FILL' 1" : "'FILL' 0",
      toggleLabel: sub ? 'Unsubscribe' : 'Subscribe',
      select: () => p.onSelect && p.onSelect(),
      toggle: e => { e.stopPropagation(); p.onToggle && p.onToggle(); },
      onCardFocus: e => { if (e.target === e.currentTarget) this.setState({ cardFocus: kb(e) }); },
      onCardBlur: () => this.setState({ cardFocus: false }),
      onBtnFocus: e => this.setState({ btnFocus: kb(e) }),
      onBtnBlur: () => this.setState({ btnFocus: false }),
    };
  }
}
</script>
</body>
</html>
